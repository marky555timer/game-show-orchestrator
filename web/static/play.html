:root {
  color-scheme: dark;
  --ground: #14100d;
  --surface: #201a15;
  --surface-inset: #2b241d;
  --hairline: #3c3126;
  --ink: #f2ece2;
  --ink-dim: #a89f92;
  --ink-faint: #766c5d;
  --signal-red: #ff3b30;
  --signal-red-glow: rgba(255, 59, 48, 0.5);
  --signal-amber: #ffb020;
  --signal-cyan: #3bd1ff;
  --signal-green: #3ba55c;
  --signal-violet: #b06bff;
  --font-display: 'Michroma', 'Arial Narrow', sans-serif;
  --font-body: 'IBM Plex Mono', ui-monospace, 'Courier New', monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0; padding: 18px 16px 56px;
  background:
    radial-gradient(ellipse 700px 380px at 50% -8%, rgba(255,59,48,0.10), transparent 60%),
    var(--ground);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  text-align: center;
}

h1 {
  font-family: var(--font-display);
  font-size: 1.05rem;
  letter-spacing: 0.04em;
  color: var(--ink);
  margin: 0 0 4px;
  text-shadow: 0 0 18px var(--signal-red-glow);
}
h1 span { color: var(--signal-red); }
.subtitle {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.34em; text-transform: uppercase;
  color: var(--ink-dim); margin: 0 0 18px;
}
.subtitle i { width: 4px; height: 4px; border-radius: 50%; background: var(--signal-cyan); box-shadow: 0 0 5px var(--signal-cyan); }

section {
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: 10px;
  padding: 16px;
  margin: 0 auto 14px;
  max-width: 380px;
}

#qr-block img { width: 150px; height: 150px; border-radius: 8px; background: #fff; padding: 6px; }
#qr-block p { font-size: .75rem; color: var(--ink-faint); margin: 8px 0 0; }

input[type=text] {
  width: 100%; padding: 14px 12px; border-radius: 8px; border: 1px solid var(--hairline);
  background: var(--surface-inset); color: var(--ink); font-size: 1.3rem; text-align: center;
  text-transform: uppercase; letter-spacing: .2em; font-family: var(--font-body); font-weight: 700;
}
input[type=text]:focus { outline: 2px solid var(--signal-red); outline-offset: 1px; }

button { cursor: pointer; font-family: var(--font-body); }
.btn {
  padding: 13px 14px; border-radius: 8px; border: 1px solid var(--hairline);
  background: var(--surface-inset); color: var(--ink); font-size: .92rem; font-weight: 600;
  width: 100%; margin-top: 10px; letter-spacing: 0.02em;
}
.btn.primary { background: var(--signal-red); border-color: var(--signal-red); color: #1c0705; font-weight: 700; box-shadow: 0 0 16px var(--signal-red-glow); }

.choice {
  width: 100%; text-align: left; padding: 14px 14px; margin-bottom: 8px; border-radius: 8px;
  border: 1px solid var(--hairline); background: var(--surface-inset); color: var(--ink); font-size: 1rem;
  font-family: var(--font-body);
}
.choice .k { color: var(--signal-amber); font-weight: 700; margin-right: 4px; }
.choice.selected { border-color: var(--signal-red); background: #331414; }
.choice.correct { border-color: var(--signal-green); background: #14301d; color: #d3ffdf; }
.choice:disabled { opacity: .55; }
.choice.correct:disabled { opacity: 1; }

.correct-message { font-size: 1rem; font-weight: 700; color: var(--signal-green); margin-bottom: 10px; }
.correct-message.wrong { color: var(--signal-red); }

.leaderboard { text-align: left; font-size: .92rem; margin-top: 10px; }
.leaderboard-title { font-family: var(--font-display); font-size: .68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-dim); border-bottom: 1px solid var(--hairline); padding-bottom: 8px; margin-bottom: 4px; }
.leaderboard-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
.leaderboard-row.me { font-weight: 700; color: var(--signal-red); }
.leaderboard .rank { color: var(--ink-faint); width: 1.4em; font-variant-numeric: tabular-nums; }
.leaderboard-row.me .rank { color: var(--signal-red); }
.leaderboard-row .lb-init { flex: 1; }
.leaderboard-row .lb-score { font-variant-numeric: tabular-nums; }

.question { font-size: 1.05rem; margin-bottom: 14px; text-wrap: balance; }
.playing-as { font-size: .82rem; color: var(--ink-dim); margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.score { font-size: 1.7rem; font-weight: 700; color: var(--ink); font-family: var(--font-display); }
.status { font-size: .88rem; color: var(--ink-dim); margin: 10px 0; }
.waiting-title { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); margin: 10px 0; text-wrap: balance; }
.rename-link { font-size: .72rem; color: var(--ink-faint); text-decoration: underline; background: none; border: none; padding: 4px; margin-top: 4px; font-family: var(--font-body); }
.hidden { display: none !important; }
.win-message { font-family: var(--font-display); font-size: 1.1rem; color: var(--signal-amber); text-shadow: 0 0 12px var(--signal-amber); margin-bottom: 14px; text-wrap: balance; }
.bonus-message { font-size: 1rem; font-weight: 700; color: var(--signal-amber); margin-bottom: 10px; }
.timer-track { width: 100%; height: 6px; border-radius: 3px; background: var(--surface-inset); overflow: hidden; margin-bottom: 12px; }
.timer-fill { height: 100%; background: var(--signal-red); box-shadow: 0 0 6px var(--signal-red-glow); transition: width .3s linear; }

/* ---------------- AVATAR (LED creature) ---------------- */
.avatar {
  --avatar-size: 56px;
  width: var(--avatar-size); height: var(--avatar-size);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--avatar-color) 28%, #241d16), #16110c 72%);
  border: 2px solid color-mix(in srgb, var(--avatar-color) 55%, var(--hairline));
  box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 0 10px color-mix(in srgb, var(--avatar-color) 35%, transparent);
  position: relative;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.avatar-face { position: relative; width: 58%; height: 44%; }
.avatar-eye {
  position: absolute; top: 8%; width: 22%; height: 10%; border-radius: 2px;
  background: var(--signal-amber); box-shadow: 0 0 5px var(--signal-amber);
}
.avatar-eye.l { left: 0; } .avatar-eye.r { right: 0; }
.avatar-mouth {
  position: absolute; bottom: 4%; left: 50%; transform: translateX(-50%);
  width: 56%; height: 12%;
  background: var(--signal-amber); box-shadow: 0 0 5px var(--signal-amber);
}

.avatar--idle { animation: avatar-breathe 3s ease-in-out infinite; }
@keyframes avatar-breathe {
  0%, 100% { box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 0 10px color-mix(in srgb, var(--avatar-color) 35%, transparent); }
  50% { box-shadow: inset 0 0 10px rgba(0,0,0,0.6), 0 0 16px color-mix(in srgb, var(--avatar-color) 55%, transparent); }
}

.avatar--excited .avatar-eye {
  clip-path: polygon(0% 100%, 50% 0%, 100% 100%); height: 22%; top: 4%;
  background: var(--signal-green); box-shadow: 0 0 6px var(--signal-green);
}
.avatar--excited .avatar-mouth {
  border-radius: 0 0 50% 50%; height: 32%;
  background: var(--signal-green); box-shadow: 0 0 6px var(--signal-green);
}
.avatar--excited { animation: avatar-bounce .6s cubic-bezier(.34,1.56,.64,1) 1; }
.avatar--excited.avatar--loop { animation: avatar-bounce .9s cubic-bezier(.34,1.56,.64,1) infinite; }
@keyframes avatar-bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  45% { transform: translateY(-8%) scale(1.05); }
  65% { transform: translateY(0) scale(0.98); }
}

.avatar--disappointed .avatar-eye {
  clip-path: polygon(0% 0%, 50% 100%, 100% 0%); height: 22%; top: 6%;
  background: var(--signal-red); box-shadow: 0 0 6px var(--signal-red);
}
.avatar--disappointed .avatar-mouth {
  border-radius: 50% 50% 0 0; height: 26%; bottom: 0;
  background: var(--signal-red); box-shadow: 0 0 6px var(--signal-red);
}
.avatar--disappointed { transform: translateY(2px) rotate(-2deg); filter: saturate(.65) brightness(.88); }

@media (prefers-reduced-motion: reduce) {
  .avatar--idle, .avatar--excited { animation: none !important; }
}

/* my avatar, shown persistently while playing */
#my-avatar-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px; }
#my-avatar { --avatar-size: 64px; }

/* signup avatar picker */
.avatar-picker { display: flex; justify-content: center; gap: 10px; margin: 12px 0 4px; }
.avatar-swatch-btn {
  background: none; border: none; padding: 3px; border-radius: 50%;
  transition: box-shadow .15s ease;
}
.avatar-swatch-btn .avatar { --avatar-size: 40px; }
.avatar-swatch-btn.selected { box-shadow: 0 0 0 2px var(--ground), 0 0 0 4px var(--ink); }

/* round roster: every connected player, live, while a question is active */
#round-roster {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 8px;
  margin: 4px 0 14px;
}
.roster-card {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: var(--surface-inset); border-radius: 8px; padding: 8px 4px 6px;
  min-width: 0;
}
.roster-card .avatar { width: 46%; height: auto; aspect-ratio: 1 / 1; }
.roster-initials { font-weight: 700; font-size: .78rem; }
.roster-score { font-size: .7rem; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.roster-status-text {
  font-family: var(--font-display); font-size: .5rem; letter-spacing: .04em;
  text-transform: uppercase; padding: 2px 5px; border-radius: 4px; text-align: center;
}
.status-thinking, .status-locked { color: var(--signal-amber); background: rgba(255,176,32,.14); }
.status-correct { color: var(--signal-green); background: rgba(59,165,92,.14); }
.status-incorrect { color: var(--signal-red); background: rgba(255,59,48,.14); }
.status-no_answer { color: var(--ink-faint); background: rgba(255,255,255,.06); }
.roster-card--no_answer .avatar { opacity: .5; filter: grayscale(.5); }

/* many players: drop the text pill, keep avatar + initials + score only */
#round-roster.dense .roster-status-text { display: none; }
#round-roster.dense .roster-card { padding: 6px 2px; gap: 2px; }
#round-roster.dense .roster-initials { font-size: .68rem; }

/* win celebration */
#win-avatar-wrap { margin: 4px 0 14px; }
#win-avatar { --avatar-size: 96px; }
</style>
</head>
<body>
  <h1>QUIZ<span>CADE</span></h1>
  <div class="subtitle">MUSIC <i></i> TRIVIA</div>

  <section id="qr-block">
    <img id="qr-img" src="/api/quiz/qr" alt="QR code">
    <p>Scan to invite others -- same page, same game.</p>
  </section>

  <section id="signup-section">
    <div class="playing-as">Enter your initials to join</div>
    <input type="text" id="initials-input" maxlength="3" placeholder="ABC" autocomplete="off">
    <div class="playing-as" style="margin-top:14px">Pick your avatar</div>
    <div id="avatar-picker" class="avatar-picker"></div>
    <button class="btn primary" onclick="join()">Join Game</button>
  </section>

  <section id="play-section" class="hidden">
    <div id="my-avatar-row">
      <div id="my-avatar" class="avatar avatar--idle"><div class="avatar-face"><span class="avatar-eye l"></span><span class="avatar-eye r"></span><span class="avatar-mouth"></span></div></div>
      <div style="text-align:left">
        <div class="playing-as" style="justify-content:flex-start">Playing as <b id="my-initials">---</b></div>
        <div class="score" id="my-score">0</div>
      </div>
    </div>
    <div id="goal-inline" class="status" style="margin-top:0"></div>
    <button class="rename-link" onclick="renamePrompt()">change initials</button>

    <div id="win-message" class="win-message hidden"></div>
    <div id="win-avatar-wrap" class="hidden"><div id="win-avatar" class="avatar avatar--excited avatar--loop"><div class="avatar-face"><span class="avatar-eye l"></span><span class="avatar-eye r"></span><span class="avatar-mouth"></span></div></div></div>
    <div id="bonus-message" class="bonus-message hidden"></div>
    <div id="goal-message" class="status hidden"></div>

    <div id="intermission-block" class="hidden">
      <div class="win-message">Intermission</div>
      <div id="intermission-countdown" class="score" style="margin-bottom:10px">5:00</div>
      <div class="status">Scores are reset -- next game starts soon.</div>
    </div>

    <div id="waiting-block" class="status">
      <div class="waiting-title" id="waiting-title">Waiting for the next question&hellip;</div>
      <div id="waiting-leaderboard" class="leaderboard"></div>
    </div>

    <div id="question-block" class="hidden">
      <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
      <div class="question" id="question-text"></div>
      <div id="correct-message" class="correct-message hidden"></div>
      <div id="round-roster"></div>
      <div id="choices"></div>
      <button class="btn primary hidden" id="lock-btn" onclick="lockAnswer()">Lock Answer</button>
      <div class="status hidden" id="locked-status">Locked in! Waiting for the round to end&hellip;</div>
    </div>
  </section>

<script>
const AVATAR_COLORS = ['red', 'amber', 'cyan', 'green', 'violet'];
// Must stay in sync with state.AVATAR_COLORS in state.py -- no shared
// config channel between the backend and this static page.
const AVATAR_COLOR_VARS = {
  red: 'var(--signal-red)', amber: 'var(--signal-amber)', cyan: 'var(--signal-cyan)',
  green: 'var(--signal-green)', violet: 'var(--signal-violet)',
};

let playerId = localStorage.getItem('player_id');
let myAvatarColor = localStorage.getItem('avatar_color') || AVATAR_COLORS[0];
let selectedAvatarColor = myAvatarColor;
let lastRoundId = null;
let mySelection = -1;
let lastChoices = [];
let lastCorrectIndex = -1;
let lastLocked = false;
let lastRosterKey = '';

async function api(path, opts) {
  try {
    const res = await fetch(path, opts);
    return await res.json();
  } catch (e) {
    return null;
  }
}

function avatarColorVar(name) {
  return AVATAR_COLOR_VARS[name] || AVATAR_COLOR_VARS[AVATAR_COLORS[0]];
}

function setAvatarPose(el, pose) {
  el.classList.remove('avatar--idle', 'avatar--excited', 'avatar--disappointed');
  el.classList.add('avatar--' + pose);
}

function renderAvatarPicker() {
  const box = document.getElementById('avatar-picker');
  box.innerHTML = AVATAR_COLORS.map(c => `
    <button type="button" class="avatar-swatch-btn${c === selectedAvatarColor ? ' selected' : ''}" data-color="${c}" onclick="pickAvatarColor('${c}')">
      <div class="avatar avatar--idle" style="--avatar-color:${avatarColorVar(c)}">
        <div class="avatar-face"><span class="avatar-eye l"></span><span class="avatar-eye r"></span><span class="avatar-mouth"></span></div>
      </div>
    </button>`).join('');
}

function pickAvatarColor(color) {
  selectedAvatarColor = color;
  document.querySelectorAll('.avatar-swatch-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.color === color);
  });
}

async function join() {
  const initials = document.getElementById('initials-input').value.trim();
  if (!initials) return;
  const d = await api('/api/player/join', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({initials, avatar_color: selectedAvatarColor}),
  });
  if (!d || !d.ok) return;
  playerId = d.player_id;
  myAvatarColor = d.avatar_color;
  localStorage.setItem('player_id', playerId);
  localStorage.setItem('avatar_color', myAvatarColor);
  showPlayView(d.initials, 0);
}

async function renamePrompt() {
  const initials = prompt('New initials (max 3 letters):');
  if (!initials) return;
  const d = await api('/api/player/rename', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({player_id: playerId, initials}),
  });
  if (d && d.ok) document.getElementById('my-initials').textContent = d.initials;
}

function showPlayView(initials, score) {
  document.getElementById('signup-section').classList.add('hidden');
  document.getElementById('play-section').classList.remove('hidden');
  document.getElementById('my-initials').textContent = initials;
  document.getElementById('my-score').textContent = score;
  document.getElementById('my-avatar').style.setProperty('--avatar-color', avatarColorVar(myAvatarColor));
}

async function selectChoice(index) {
  const d = await api('/api/player/select', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({player_id: playerId, index}),
  });
  if (d && d.ok) {
    mySelection = index;
    renderChoices(lastChoices, lastCorrectIndex, lastLocked);
    document.getElementById('lock-btn').classList.remove('hidden');
  }
}

async function lockAnswer() {
  const d = await api('/api/player/lock', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({player_id: playerId}),
  });
  if (d && d.ok) {
    document.getElementById('lock-btn').classList.add('hidden');
    document.getElementById('locked-status').classList.remove('hidden');
    document.querySelectorAll('.choice').forEach(b => b.disabled = true);
  }
}

function renderChoices(choices, correctIndex, locked) {
  lastChoices = choices;
  const box = document.getElementById('choices');
  box.innerHTML = '';
  choices.forEach((text, i) => {
    const b = document.createElement('button');
    let cls = 'choice';
    if (i === mySelection) cls += ' selected';
    if (locked && i === correctIndex) cls += ' correct';
    b.className = cls;
    b.innerHTML = `<span class="k">${"ABCD"[i]}.</span> ${text}`;
    b.onclick = () => selectChoice(i);
    box.appendChild(b);
  });
}

function renderLeaderboard(leaderboard, winScore) {
  const box = document.getElementById('waiting-leaderboard');
  if (!leaderboard || !leaderboard.length) {
    box.innerHTML = '';
    return;
  }
  const rows = leaderboard.map((p, i) => {
    const isMe = p.player_id === playerId;
    return `<div class="leaderboard-row${isMe ? ' me' : ''}">
      <span class="rank">${i + 1}.</span>
      <div class="avatar avatar--idle" style="--avatar-size:22px;--avatar-color:${avatarColorVar(p.avatar_color)}">
        <div class="avatar-face"><span class="avatar-eye l"></span><span class="avatar-eye r"></span><span class="avatar-mouth"></span></div>
      </div>
      <span class="lb-init">${p.initials}</span>
      <span class="lb-score">${p.score}</span>
    </div>`;
  }).join('');
  const title = winScore ? `Leaderboard (first to ${winScore} wins)` : 'Leaderboard';
  box.innerHTML = `<div class="leaderboard-title">${title}</div>${rows}`;
}

function rosterStatusLabel(status) {
  switch (status) {
    case 'thinking': return 'IS THINKING';
    case 'locked': return 'LOCKED IN';
    case 'correct': return 'GOT IT RIGHT!';
    case 'incorrect': return 'GOT IT WRONG';
    case 'no_answer': return 'NO ANSWER';
    default: return '';
  }
}
function rosterStatusPose(status) {
  if (status === 'correct') return 'excited';
  if (status === 'incorrect') return 'disappointed';
  return 'idle'; // thinking, locked, no_answer -- no reveal yet
}
function renderRoundRoster(roster) {
  const box = document.getElementById('round-roster');
  if (!roster || !roster.length) {
    box.innerHTML = '';
    box.classList.remove('dense');
    lastRosterKey = '';
    return;
  }
  // Cheap guard against re-rendering (and re-triggering CSS animations) on
  // every 1.2s poll while the same statuses are still showing.
  const key = roster.map(p => p.player_id + ':' + p.status + ':' + p.score).join(',');
  if (key === lastRosterKey) return;
  lastRosterKey = key;
  box.classList.toggle('dense', roster.length > 12);
  box.innerHTML = roster.map(p => `
    <div class="roster-card roster-card--${p.status}">
      <div class="avatar avatar--${rosterStatusPose(p.status)}" style="--avatar-color:${avatarColorVar(p.avatar_color)}">
        <div class="avatar-face"><span class="avatar-eye l"></span><span class="avatar-eye r"></span><span class="avatar-mouth"></span></div>
      </div>
      <span class="roster-initials">${p.initials}</span>
      <span class="roster-score">${p.score}</span>
      <span class="roster-status-text status-${p.status}">${rosterStatusLabel(p.status)}</span>
    </div>`).join('');
}

async function poll() {
  if (!playerId) return;
  const d = await api('/api/player/question?player_id=' + encodeURIComponent(playerId));
  if (!d) return;
  if (!d.ok) {
    // Server restarted or otherwise forgot us -- fall back to sign-up.
    localStorage.removeItem('player_id');
    localStorage.removeItem('avatar_color');
    playerId = null;
    document.getElementById('play-section').classList.add('hidden');
    document.getElementById('signup-section').classList.remove('hidden');
    return;
  }

  document.getElementById('my-score').textContent = d.score;
  lastCorrectIndex = d.correct_index;
  lastLocked = d.locked_globally;
  if (d.avatar_color && d.avatar_color !== myAvatarColor) {
    myAvatarColor = d.avatar_color;
    localStorage.setItem('avatar_color', myAvatarColor);
    document.getElementById('my-avatar').style.setProperty('--avatar-color', avatarColorVar(myAvatarColor));
  }

  if (d.win_score) {
    document.getElementById('goal-inline').textContent = `Goal: ${d.win_score} pts to win`;
  }

  const winBox = document.getElementById('win-message');
  const winAvatarWrap = document.getElementById('win-avatar-wrap');
  if (d.win_message) {
    winBox.textContent = d.win_message;
    winBox.classList.remove('hidden');
    if (d.winner_avatar_color) {
      document.getElementById('win-avatar').style.setProperty('--avatar-color', avatarColorVar(d.winner_avatar_color));
      winAvatarWrap.classList.remove('hidden');
    }
  } else {
    winBox.classList.add('hidden');
    winAvatarWrap.classList.add('hidden');
  }

  const bonusBox = document.getElementById('bonus-message');
  if (d.bonus_message) {
    bonusBox.textContent = d.bonus_message;
    bonusBox.classList.remove('hidden');
  } else {
    bonusBox.classList.add('hidden');
  }
  const goalBox = document.getElementById('goal-message');
  if (d.win_message && d.win_score) {
    goalBox.textContent = `Goal: ${d.win_score} pts to win`;
    goalBox.classList.remove('hidden');
  } else {
    goalBox.classList.add('hidden');
  }

  if (d.round_id !== lastRoundId) {
    lastRoundId = d.round_id;
    mySelection = d.selected_index;
    document.getElementById('lock-btn').classList.add('hidden');
    document.getElementById('locked-status').classList.add('hidden');
  }

  const waiting = document.getElementById('waiting-block');
  const qBlock = document.getElementById('question-block');
  const intermissionBlock = document.getElementById('intermission-block');
  const myAvatar = document.getElementById('my-avatar');

  if (d.intermission_active) {
    waiting.classList.add('hidden');
    qBlock.classList.add('hidden');
    intermissionBlock.classList.remove('hidden');
    setAvatarPose(myAvatar, 'idle');
    const remaining = Math.max(0, Math.round(d.intermission_remaining_seconds || 0));
    const mm = Math.floor(remaining / 60);
    const ss = String(remaining % 60).padStart(2, '0');
    document.getElementById('intermission-countdown').textContent = `${mm}:${ss}`;
    return;
  }
  intermissionBlock.classList.add('hidden');

  if (!d.active || d.win_message) {
    waiting.classList.remove('hidden');
    qBlock.classList.add('hidden');
    document.getElementById('waiting-title').textContent =
      (d.mode === 'DJ') ? 'Waiting for the next song…' : 'Waiting for the next question…';
    renderLeaderboard(d.leaderboard, d.win_score);
    if (!d.win_message) setAvatarPose(myAvatar, 'idle');
    return;
  }
  waiting.classList.add('hidden');
  qBlock.classList.remove('hidden');
  document.getElementById('question-text').textContent = d.question;
  renderChoices(d.choices, d.correct_index, d.locked_globally);
  renderRoundRoster(d.round_roster);

  const msgBox = document.getElementById('correct-message');
  if (d.locked_globally) {
    const gotItRight = mySelection === d.correct_index;
    let msg = gotItRight ? 'Correct!' : 'Not quite.';
    if (d.correction) {
      msg = gotItRight ? `That's right! ${d.correction}` : `Actually, ${d.correction}`;
    }
    msgBox.textContent = msg;
    msgBox.classList.toggle('wrong', !gotItRight);
    msgBox.classList.remove('hidden');
    setAvatarPose(myAvatar, gotItRight ? 'excited' : 'disappointed');
  } else {
    msgBox.classList.add('hidden');
    setAvatarPose(myAvatar, 'idle');
  }

  const total = d.timeout_seconds || 30;
  const pct = Math.max(0, Math.min(100, (d.remaining_seconds / total) * 100));
  document.getElementById('timer-fill').style.width = pct + '%';

  if (d.locked || d.locked_globally) {
    document.querySelectorAll('.choice').forEach(b => b.disabled = true);
    document.getElementById('lock-btn').classList.add('hidden');
    if (d.locked) document.getElementById('locked-status').classList.remove('hidden');
  } else if (d.selected_index >= 0) {
    document.getElementById('lock-btn').classList.remove('hidden');
  }
}

async function init() {
  renderAvatarPicker();
  if (playerId) {
    const d = await api('/api/player/whoami?player_id=' + encodeURIComponent(playerId));
    if (d && d.ok) {
      myAvatarColor = d.avatar_color || myAvatarColor;
      localStorage.setItem('avatar_color', myAvatarColor);
      showPlayView(d.initials, d.score);
    } else {
      localStorage.removeItem('player_id');
      localStorage.removeItem('avatar_color');
      playerId = null;
    }
  }
  setInterval(poll, 1200);
  poll();
}
init();
</script>
</body>
</html>
